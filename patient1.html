<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Appointments - RBAC Medical</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding-top: 70px; font-family: Arial, sans-serif; background: #e6f4ea; }
  .navbar { background-color: #2e7d32 !important; }
  .navbar-brand, .nav-link { color: #fff !important; }
  h2 { color: #2e7d32; margin-bottom: 20px; }
  table { background: #fff; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><i class="bi bi-heart-pulse-fill me-1"></i>RBAC Medical</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
  
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Appointments</a></li>
        <li class="nav-item"><a class="nav-link text-warning" href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="text-center">Your Appointments</h2>
  <div class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead class="table-success">
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>Doctor</th>
          <th>Date</th>
          <th>Time</th>
          <th>Phone</th>
          <th>Reason</th>
          <th>Payment</th>
        </tr>
      </thead>
      <tbody id="appointmentsBody">
      </tbody>
    </table>
  </div>
</div>

<script>
  function loadAppointments() {
    const appointments = JSON.parse(localStorage.getItem("appointments") || "[]");
    const tbody = document.getElementById("appointmentsBody");
    tbody.innerHTML = "";
    appointments.forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${a.name}</td>
        <td>${a.address}</td>
        <td>${a.doctor.split("|")[0]}</td>
        <td>${a.date}</td>
        <td>${a.time}</td>
        <td>${a.phone}</td>
        <td>${a.reason}</td>
        <td>${a.payment}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function logout(){
    localStorage.clear();
    window.location.href = "index.html";
  }

  window.onload = loadAppointments;
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
