<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical RBAC Dashboard</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>
  body {
    background: linear-gradient(to bottom right, #e6f4ea, #b2dfdb);
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding-top: 70px;
  }

  /* Navbar */
  .navbar { background-color: #2e7d32 !important; }
  .navbar-brand, .nav-link { color: #fff !important; }

  /* Headings */
  h1 { color: #2e7d32; animation: slideDown 0.8s ease; }

  /* Dashboard Cards */
  .dashboard-card {
    background-color: #ffffffdd;
    border: 1px solid #c8e6c9;
    box-shadow: 0 4px 10px rgba(0,128,0,0.1);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
    animation: fadeIn 0.8s ease;
  }
  .dashboard-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .dashboard-card i {
    font-size: 40px;
    color: #2e7d32;
    margin-bottom: 10px;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px);}
    to { opacity: 1; transform: translateY(0);}
  }

  /* Responsive */
  @media (max-width: 768px) {
    .dashboard-card { margin-bottom: 15px; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html">MedApp Dashboard</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="appointment.html">Appointments</a></li>
        <li class="nav-item"><a class="nav-link" href="patients.html">Patients</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
        <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        <li class="nav-item"><a class="nav-link text-warning" href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Dashboard Section -->
<div class="container mt-4">
  <h1 class="text-center mb-4">Welcome to Medical RBAC Dashboard</h1>
  <div class="row g-4">
    <div class="col-md-3">
      <div class="dashboard-card" onclick="redirectTo('appointment.html')">
        <i class="bi bi-calendar-check"></i>
        <h5>Appointments</h5>
        <p>Book and view appointments</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="dashboard-card" onclick="redirectTo('patients.html')">
        <i class="bi bi-people"></i>
        <h5>Patients</h5>
        <p>Manage patient records</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="dashboard-card" onclick="redirectTo('doctors.html')">
        <i class="bi bi-person-badge"></i>
        <h5>Doctors</h5>
        <p>View and manage doctors</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="dashboard-card" onclick="redirectTo('settings.html')">
        <i class="bi bi-gear"></i>
        <h5>Settings</h5>
        <p>Update preferences</p>
      </div>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Redirect each card to its page
  function redirectTo(page) {
    window.location.href = page;
  }

  // Logout redirects to admin dashboard
  function logout() {
    window.location.href = "admin-dashboard.html";
  }
</script>

</body>
</html>
