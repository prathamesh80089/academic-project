<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RBAC Medical — Router Demo</title>
  <style>
    :root{
      --bg:#0f172a; --card:#0b1220; --accent:#06b6d4; --muted:#94a3b8; --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#071029 0%, #051428 100%);
      color:#e6eef6;
      min-height:100vh;
      display:flex;
      gap:20px;
      padding:20px;
    }
    .app {
      display:flex;
      width:100%;
      gap:20px;
    }
    .sidebar{
      width:260px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:18px;
      box-shadow: 0 6px 20px rgba(2,6,23,0.6);
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:stretch;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
    }
    .logo{
      width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:#021025; font-size:18px;
    }
    h1{font-size:16px;margin:0;color:#dff6fb}
    .muted{color:var(--muted);font-size:13px}
    .nav{
      display:flex;flex-direction:column;gap:8px;margin-top:6px;
    }
    .nav a{
      text-decoration:none;padding:10px;border-radius:8px;color:inherit;display:flex;justify-content:space-between;align-items:center;
    }
    .nav a:hover{background:var(--glass)}
    .nav a.active{background:rgba(6,182,212,0.12);border-left:3px solid var(--accent);padding-left:8px}
    .role-box{
      margin-top:auto;
      display:flex;flex-direction:column;gap:8px;
    }
    select, button {
      width:100%;
      padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);
      background:transparent;color:inherit;
    }
    .status{
      font-size:13px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);
    }
    .main{
      flex:1;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;padding:20px;box-shadow: 0 6px 20px rgba(2,6,23,0.6);
      min-height:520px; overflow:auto;
    }
    .page{
      animation: fadeIn 260ms ease;
    }
    @keyframes fadeIn { from{opacity:0; transform: translateY(6px)} to{opacity:1; transform:none} }
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); padding:16px;border-radius:10px;margin-bottom:12px}
    .kpi{display:flex;gap:12px;flex-wrap:wrap}
    .kpi > div{min-width:140px;padding:10px;border-radius:8px;background:rgba(6,182,212,0.03);}
    .hint{color:var(--muted);font-size:13px}
    .danger{color:#ff9b9b}
    .ok{color:#9df2ff}
    @media (max-width:780px){
      body{padding:12px}
      .sidebar{display:none}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">MD</div>
        <div>
          <h1>MedRBAC</h1>
          <div class="muted">Role-based routing demo</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="/dashboard">Home</a>
        <a href="#/admin" data-route="/admin">Admin Dashboard</a>
        <a href="#/doctor" data-route="/doctor">Doctor Dashboard</a>
        <a href="#/nurse" data-route="/nurse">Nurse Dashboard</a>
        <a href="#/patient" data-route="/patient">Patient Dashboard</a>
        <a href="#/appointments" data-route="/appointments">Appointments</a>
        <a href="#/records" data-route="/records">Medical Records</a>
        <a href="#/profile" data-route="/profile">Profile</a>
        <a href="#/hospitalroute" data-route="/hospitalroute">Hospital Route</a>
      </nav>
      <div class="role-box">
        <div class="muted">Simulate login</div>
        <select id="roleSelect">
          <option value="">— Not logged in —</option>
          <option value="admin">Admin</option>
          <option value="doctor">Doctor</option>
          <option value="nurse">Nurse</option>
          <option value="patient">Patient</option>
        </select>
        <button id="btnLogout">Logout (clear)</button>
        <div class="status" id="status">Role: <span id="currentRole">guest</span></div>
        <div class="hint">Tip: This is a front-end demo of RBAC. Real auth must happen on the server.</div>
      </div>
    </aside>
    <main class="main" id="main">
      <!-- content injected here -->
    </main>
  </div>
<script>
const Auth = {
  role: '',
  loginAs(role){ this.role = role; localStorage.setItem('demo_role', role || ''); updateUI(); },
  logout(){ this.role=''; localStorage.removeItem('demo_role'); updateUI(); },
  load(){ const r=localStorage.getItem('demo_role'); this.role = r || ''; updateUI(); }
};

const routes = {
  '/dashboard': { title:'Home', component: pageHome, allowed: ['admin','doctor','nurse','patient'] },
  '/admin':     { title:'Admin Dashboard', component: pageAdmin, allowed: ['admin'] },
  '/doctor':    { title:'Doctor Dashboard', component: pageDoctor, allowed: ['doctor','admin'] },
  '/nurse':     { title:'Nurse Dashboard', component: pageNurse, allowed: ['nurse','admin'] },
  '/patient':   { title:'Patient Dashboard', component: pagePatient, allowed: ['patient'] },
  '/appointments': { title:'Appointments', component: pageAppointments, allowed: ['doctor','nurse','patient','admin'] },
  '/records':   { title:'Medical Records', component: pageRecords, allowed: ['doctor','nurse','admin'] },
  '/profile':   { title:'Profile', component: pageProfile, allowed: ['admin','doctor','nurse','patient'] },
  '/hospitalroute': { title:'Hospital Route', component: pageHospitalRoute, allowed: ['admin','doctor','nurse','patient'] },
  '/401':       { title:'Unauthorized', component: page401, allowed: ['admin','doctor','nurse','patient'] },
  '/404':       { title:'Not found', component: page404, allowed: ['admin','doctor','nurse','patient'] }
};

function getHashRoute(){
  const hash = location.hash || '#/dashboard';
  const path = hash.split('?')[0].replace(/^#/, '');
  return path || '/dashboard';
}
function navigateTo(path){ location.hash = path; }

function renderRoute(){
  const path = getHashRoute();
  const route = routes[path] || routes['/404'];
  const userRole = Auth.role || '';
  if(route.allowed && route.allowed.length > 0){
    if(!userRole){
      return navigateTo('/401');
    }
    if(!route.allowed.includes(userRole)){
      return navigateTo('/401');
    }
  }
  document.querySelectorAll('#nav a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('data-route') === path);
  });
  document.title = 'MedRBAC — ' + (route.title || 'Page');
  const main = document.getElementById('main');
  main.innerHTML = '';
  const container = document.createElement('section');
  container.className = 'page';
  container.innerHTML = `<h2 style="margin-top:0">${route.title || ''}</h2>`;
  main.appendChild(container);
  route.component(container);
}

// ---- Components ----
function pageHome(el){
  el.innerHTML += `
    <div class="card">
      <p>Welcome to the Medical RBAC demo.</p>
      <div class="kpi">
        <div><strong>Active Role</strong><div id="kpi-role">${Auth.role || 'guest'}</div></div>
        <div><strong>Patients Today</strong><div>34</div></div>
        <div><strong>Appointments</strong><div>18</div></div>
      </div>
    </div>
  `;
}
function pageAdmin(el){
  el.innerHTML += `<div class="card"><h3>Admin Controls</h3><p>Manage users, system settings, roles.</p></div>`;
}
function pageDoctor(el){
  el.innerHTML += `<div class="card"><h3>Doctor Dashboard</h3><p>Today's patients and notes.</p></div>`;
}
function pageNurse(el){
  el.innerHTML += `<div class="card"><h3>Nurse Dashboard</h3><p>Vitals queue, medication tasks.</p></div>`;
}
function pagePatient(el){
  el.innerHTML += `<div class="card"><h3>Patient Portal</h3><p>Your appointments and prescriptions.</p></div>`;
}
function pageAppointments(el){
  el.innerHTML += `<div class="card"><h3>Appointments</h3><p>List depending on role.</p></div>`;
}
function pageRecords(el){
  el.innerHTML += `<div class="card"><h3>Medical Records</h3><p>Doctor & nurse can view/edit.</p></div>`;
}
function pageProfile(el){
  el.innerHTML += `<div class="card"><h3>Profile</h3><p>Basic profile info.</p></div>`;
}
function pageHospitalRoute(el){
  el.innerHTML += `
    <div class="card">
      <h3>Hospital Route / Directions</h3>
      <p>Below is a live map to our hospital.</p>
      <div style="width:100%;height:400px;border-radius:8px;overflow:hidden;margin-top:12px">
        <!-- Google Maps embed link: you can replace the src with your hospital address -->
        <iframe 
          width="100%" 
          height="100%" 
          style="border:0" 
          loading="lazy" 
          allowfullscreen 
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.853874969162!2d72.87765541490048!3d19.076090087084936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c630191f9493%3A0xf403f7083fba6b07!2sMumbai%20Hospital!5e0!3m2!1sen!2sin!4v1694706330000!5m2!1sen!2sin">
        </iframe>
      </div>
      <p class="hint">Tip: Replace the embed <code>src</code> with your hospital’s actual map link.</p>
    </div>
  `;
}
function page401(el){
  el.innerHTML += `<div class="card danger"><h3>401 — Unauthorized</h3><p>You do not have permission to view this page.</p><p><button onclick="navigateTo('/dashboard')">Back to Home</button></p></div>`;
}
function page404(el){
  el.innerHTML += `<div class="card danger"><h3>404 — Not Found</h3><p>That route doesn't exist.</p></div>`;
}

// UI wiring
const roleSelect = document.getElementById('roleSelect');
const btnLogout = document.getElementById('btnLogout');
const currentRoleSpan = document.getElementById('currentRole');
function updateUI(){
  roleSelect.value = Auth.role || '';
  currentRoleSpan.textContent = Auth.role || 'guest';
}
roleSelect.addEventListener('change', e=>{
  const r = e.target.value;
  Auth.loginAs(r);
  if(r==='admin') navigateTo('/admin');
  else if(r==='doctor') navigateTo('/doctor');
  else if(r==='nurse') navigateTo('/nurse');
  else if(r==='patient') navigateTo('/patient');
  else navigateTo('/dashboard');
});
btnLogout.addEventListener('click', ()=>{
  Auth.logout();
  navigateTo('/dashboard');
});
Auth.load();
window.addEventListener('hashchange', renderRoute);
if(!location.hash) location.hash = '#/dashboard';
renderRoute();
window.navigateTo = navigateTo;
</script>
</body>
</html>
