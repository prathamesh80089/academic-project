<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBAC Medical Appointment QR</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- QRCode.js Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
  body {
    background: linear-gradient(135deg, #d0f0fd, #a0e1f7);
    font-family: Arial, sans-serif;
  }
  .container {
    margin-top: 50px;
    text-align: center;
  }
  #qrcode {
    margin-top: 20px;
  }
  .btn {
    margin: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>RBAC Medical Appointment Payment</h2>
  <p>Select your payment mode:</p>

  <button id="onlinePaymentBtn" class="btn btn-primary">Pay Online</button>
  <button id="offlinePaymentBtn" class="btn btn-secondary">Pay Offline</button>

  <div id="qrcode"></div>
</div>

<script>
  // Simulated user role for RBAC
  const userRole = "patient"; // "patient" can see QR, "admin" cannot see patient QR

  // Handle online payment
  document.getElementById('onlinePaymentBtn').addEventListener('click', function() {
      // Simulate payment success
      alert("Payment Successful!");

      // Only patients can see their QR code
      if(userRole === "patient") {
          // Example appointment data
          const appointmentData = {
              patientName: "John Doe",
              doctorName: "Dr. Smith",
              date: "2025-09-20",
              time: "10:30 AM",
              appointmentID: "APPT123456"
          };

          // Convert data to a string for QR code
          const qrData = JSON.stringify(appointmentData);
          generateQRCode(qrData);
      } else {
          alert("You do not have permission to view this QR code.");
      }
  });

  // Handle offline payment
  document.getElementById('offlinePaymentBtn').addEventListener('click', function() {
      alert("Offline payment selected. Please pay at the clinic.");
      document.getElementById('qrcode').innerHTML = "";
  });

  // Function to generate QR code
  function generateQRCode(data) {
      const qrcodeContainer = document.getElementById('qrcode');
      qrcodeContainer.innerHTML = ""; // clear previous QR code

      QRCode.toCanvas(qrcodeContainer, data, { width: 200 }, function (error) {
          if(error) console.error(error);
          else console.log("QR code generated successfully!");
      });
  }
</script>

</body>
</html>
