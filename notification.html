<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Date Notifications</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {font-family:sans-serif; background:#f0f4f7; margin:0; padding:20px;}
.card {padding:20px; border-radius:15px; box-shadow:0 4px 20px rgba(0,0,0,0.1);}
.notification {position:fixed; top:20px; right:20px; background:#28a745; color:white; padding:15px 20px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2); display:none; z-index:1000;}
.notification.warning {background:#ffc107; color:#333;}
.notification.error {background:#dc3545;}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h3>Book a Date</h3>
    <input type="text" id="eventName" class="form-control mb-2" placeholder="Event Name">
    <input type="date" id="eventDate" class="form-control mb-2">
    <button class="btn btn-primary w-100" onclick="addEvent()">Add Event</button>
    <hr>
    <h5>Upcoming Events:</h5>
    <ul id="eventsList"></ul>
  </div>
</div>

<div id="notification" class="notification"></div>

<script>
let events = JSON.parse(localStorage.getItem('events') || '[]');

// Render event list
function renderEvents(){
  const ul = document.getElementById('eventsList');
  ul.innerHTML='';
  events.forEach((ev,index)=>{
    ul.innerHTML += `<li>${ev.name} - ${ev.date} 
      <button class="btn btn-sm btn-danger ms-2" onclick="deleteEvent(${index})">Delete</button>
    </li>`;
  });
}

// Add Event
function addEvent(){
  const name = document.getElementById('eventName').value.trim();
  const date = document.getElementById('eventDate').value;
  if(!name||!date){ alert('Fill both fields'); return; }
  events.push({name,date});
  localStorage.setItem('events', JSON.stringify(events));
  document.getElementById('eventName').value='';
  document.getElementById('eventDate').value='';
  renderEvents();
  checkNotifications();
}

// Delete Event
function deleteEvent(index){
  events.splice(index,1);
  localStorage.setItem('events', JSON.stringify(events));
  renderEvents();
}

// Notification system
function showNotification(msg,type='success'){
  const notif = document.getElementById('notification');
  notif.innerText = msg;
  notif.className = `notification ${type}`;
  notif.style.display='block';
  setTimeout(()=>{notif.style.display='none';},5000);
}

// Check for upcoming dates
function checkNotifications(){
  const today = new Date();
  events.forEach(ev=>{
    const eventDate = new Date(ev.date);
    const diffTime = eventDate - today;
    const diffDays = Math.ceil(diffTime / (1000*60*60*24));
    if(diffDays>0 && diffDays<=3){ // notify if within 3 days
      showNotification(`Reminder: "${ev.name}" is coming in ${diffDays} day(s)!`);
    }
  });
}

// Initial render
renderEvents();

// Check notifications every minute
setInterval(checkNotifications, 60000); // 60000ms = 1 minute

// Check once on page load
checkNotifications();
</script>

</body>
</html>
