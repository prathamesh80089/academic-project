<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Report - RBAC Medical</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif;}
body {display:flex; background:#f1f5f9; color:#333; min-height:100vh; transition:0.3s;}

/* Sidebar */
.sidebar {
  width:250px; background:#183153; color:#fff; display:flex; flex-direction:column;
  min-height:100vh; padding:20px 0; transition:0.3s;
}
.sidebar h2 {text-align:center; font-size:1.5rem; margin-bottom:2rem; font-weight:600;}
.sidebar ul {list-style:none;}
.sidebar ul li {padding:15px 20px; cursor:pointer;}
.sidebar ul li a {color:inherit; text-decoration:none; display:flex; width:100%;}
.sidebar ul li:hover {background:#0f2642;}
.sidebar .logout {margin-top:auto; color:#f87171;}

/* Main content */
.main-content {flex:1; padding:30px;}
.header {display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
.header h1 {font-size:1.8rem; font-weight:600;}
.header h1 span {color:#3b82f6;}
.header-right {display:flex; align-items:center; gap:15px;}
.search-bar {padding:5px 10px; border-radius:6px; border:1px solid #ccc;}

/* Cards */
.cards {display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin-top:20px;}
.card {background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease;}
.card:hover {transform: translateY(-8px); box-shadow:0 8px 20px rgba(0,0,0,0.2); cursor:pointer;}
.card h3 {font-size:1rem; font-weight:600; margin-bottom:10px;}
.card p {font-size:1.2rem; font-weight:600; color:#3b82f6;}
.chart-container {width:100%; height:200px;}

/* Table */
.table-container {margin-top:30px; background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
table {width:100%; border-collapse:collapse;}
th, td {padding:10px; text-align:left; border-bottom:1px solid #eee;}
th {background:#2e7d32; color:#fff; border-radius:5px;}
tr:hover {background:#f0fdf4; cursor:pointer;}

/* Dark mode */
.dark-mode {background:#1f2937; color:#fff;}
.dark-mode .sidebar {background:#111827;}
.dark-mode .card, .dark-mode .table-container {background:#374151; color:#fff;}
.dark-mode .card p {color:#60a5fa;}
.dark-mode table th {background:#2563eb;}
.dark-mode table tr:hover {background:#4b5563;}
.dark-mode .search-bar {background:#374151; color:#fff; border:1px solid #555;}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
<h2>Admin</h2>
<ul>
  <li><a href="dashboard.html">📊 <span>Dashboard</span></a></li>
  <li><a href="doctor-dashboard.html">👨‍⚕️ <span>Doctor Dashboard</span></a></li>
  <li><a href="progress-report.html">📑 <span>Progress Report</span></a></li>
  <li><a href="#">💬 <span>Messages</span></a></li>
  <li><a href="#">⚙ <span>Settings</span></a></li>
  <li class="logout">🚪 <span>Logout</span></li>
</ul>
</div>

<!-- Main Content -->
<div class="main-content">
<div class="header">
<h1>Progress Reports</h1>
<div class="header-right">
<input type="text" placeholder="Search report..." class="search-bar" id="searchInput">
<button id="darkModeToggle">🌙</button>
</div>
</div>

<div class="cards">
<div class="card"><h3>Total Reports</h3><p>350</p></div>
<div class="card"><h3>Pending Reports</h3><p>45</p></div>
<div class="card"><h3>Reviewed Reports</h3><p>305</p></div>
<div class="card"><h3>New Reports</h3><p>12</p></div>
<div class="card"><h3>Reports by Month</h3><canvas id="monthlyReportsChart" class="chart-container"></canvas></div>
</div>

<div class="table-container">
<h3>Recent Reports</h3>
<table id="reportTable">
  <thead>
    <tr>
      <th>Patient</th>
      <th>Doctor</th>
      <th>Date</th>
      <th>Status</th>
      <th>Remarks</th>
    </tr>
  </thead>
  <tbody id="reportBody">
    <!-- Dynamic rows -->
  </tbody>
</table>
</div>
</div>

<script>
// Dark Mode Toggle
document.getElementById('darkModeToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('dark-mode');
});

// Sample Report Data
const reports = [
  {patient:'Parag Sawant', doctor:'Dr. John Smith', date:'2025-09-20', status:'Reviewed', remarks:'Stable progress'},
  {patient:'Emily Clark', doctor:'Dr. Alice Brown', date:'2025-09-21', status:'Pending', remarks:'Awaiting results'},
  {patient:'Saumit Gurav', doctor:'Dr. John Smith', date:'2025-09-22', status:'Reviewed', remarks:'Improvement noted'},
  {patient:'John Doe', doctor:'Dr. Alice Brown', date:'2025-09-22', status:'Pending', remarks:'Lab tests pending'},
];

// Populate Table
const tbody = document.getElementById('reportBody');
reports.forEach(r=>{
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${r.patient}</td><td>${r.doctor}</td><td>${r.date}</td><td>${r.status}</td><td>${r.remarks}</td>`;
  tbody.appendChild(tr);
});

// Filter table
document.getElementById('searchInput').addEventListener('keyup', function(){
  const value = this.value.toLowerCase();
  Array.from(tbody.getElementsByTagName('tr')).forEach(row=>{
    row.style.display = row.innerText.toLowerCase().includes(value) ? '' : 'none';
  });
});

// Chart
const ctxMonthly = document.getElementById('monthlyReportsChart').getContext('2d');
new Chart(ctxMonthly,{
  type:'bar',
  data:{
    labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'],
    datasets:[{label:'Reports', data:[30,45,50,35,60,40,55,70,65], backgroundColor:'#3b82f6'}]
  },
  options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
});
</script>
</body>
</html>
