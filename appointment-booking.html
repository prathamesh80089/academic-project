<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Booking - RBAC Medical</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom right, #e6f4ea, #b2dfdb); /* parrot gradient */
    min-height: 100vh;
    padding-top: 70px;
  }
  h2 { color: #2e7d32; text-align: center; margin-bottom: 30px; }
  .card { background-color: #ffffffdd; border:1px solid #c8e6c9; box-shadow:0 4px 10px rgba(0,128,0,0.1); }
  .status-badge { padding: 5px 10px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 0.8rem; }
  .Pending { background: #f59e0b; }
  .Confirmed { background: #10b981; }
  .Completed { background: #3b82f6; }
  .Cancelled { background: #ef4444; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">RBAC Medical</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav" aria-controls="navbarNav"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Appointments</a></li>
        <li class="nav-item"><a class="nav-link text-warning" href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2>Book a Medical Appointment</h2>

  <!-- Booking Form -->
  <div class="card p-4 mb-4 mx-auto" style="max-width: 700px;">
    <div class="mb-3">
      <label for="patientName" class="form-label">Patient Name</label>
      <input type="text" id="patientName" class="form-control" placeholder="Enter your name"/>
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <input type="text" id="address" class="form-control" placeholder="Enter your address"/>
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number"/>
    </div>
    <div class="mb-3">
      <label for="doctor" class="form-label">Select Doctor</label>
      <select id="doctor" class="form-select">
        <option value="">Choose...</option>
        <option value="Dr. John Smith|Cardiologist|10 years">Dr. John Smith - Cardiologist</option>
        <option value="Dr. Alice Brown|Dermatologist|8 years">Dr. Alice Brown - Dermatologist</option>
        <option value="Dr. Kevin White|General Physician|12 years">Dr. Kevin White - General Physician</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="date" class="form-label">Select Date</label>
      <input type="date" id="date" class="form-control"/>
    </div>
    <div class="mb-3">
      <label for="time" class="form-label">Select Time</label>
      <input type="time" id="time" class="form-control"/>
    </div>
    <div class="mb-3">
      <label for="reason" class="form-label">Reason for Visit</label>
      <textarea id="reason" class="form-control" rows="2"></textarea>
    </div>
    <div class="mb-3">
      <label for="payment" class="form-label">Payment Method</label>
      <select id="payment" class="form-select">
        <option value="">Select Payment Type</option>
        <option value="Cash">Cash</option>
        <option value="Online">Online</option>
      </select>
    </div>
    <button class="btn btn-success w-100" onclick="bookAppointment()">Book Appointment</button>
  </div>

  <!-- Appointments Table -->
  <h4 class="mb-3">Your Appointments</h4>
  <div class="table-responsive">
    <table class="table table-striped table-bordered" id="appointmentsTable">
      <thead class="table-success">
        <tr>
          <th>Patient Name</th>
          <th>Address</th>
          <th>Phone</th>
          <th>Doctor</th>
          <th>Specialty</th>
          <th>Experience</th>
          <th>Date</th>
          <th>Time</th>
          <th>Reason</th>
          <th>Payment</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  async function bookAppointment() {
    const patientName = document.getElementById("patientName").value.trim();
    const address = document.getElementById("address").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const doctorInfo = document.getElementById("doctor").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const reason = document.getElementById("reason").value.trim();
    const payment = document.getElementById("payment").value;

    if (!patientName || !address || !phone || !doctorInfo || !date || !time || !reason || !payment) {
      alert("Please fill all fields!");
      return;
    }

    const [doctor, specialty, experience] = doctorInfo.split("|");

    try {
      const res = await fetch("http://localhost:5000/api/appointments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          patientName,
          address,
          phone,
          doctor,
          specialty,
          experience,
          date,
          time,
          reason,
          payment,
        }),
      });

      const data = await res.json();

      if (res.ok) {
        alert(`Appointment booked successfully for ${patientName}.`);
        window.location.href = "admin-dashboard.html";
      } else {
        alert(data.message || "Error saving appointment.");
      }
    } catch (err) {
      console.error(err);
      alert("Server error. Please try again later.");
    }
  }
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
