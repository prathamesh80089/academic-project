<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Auditing & Logging - RBAC Medical</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f4f6fb; font-family:'Poppins',sans-serif; padding:20px; }
.container { max-width:1200px; margin:auto; }
.card { border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); margin-bottom:20px; }
h2 { text-align:center; margin-bottom:30px; }

.audit-log { max-height:500px; overflow-y:auto; background:#f3f4f6; border-radius:6px; padding:10px; }
.audit-row { padding:8px 10px; margin-bottom:4px; border-radius:4px; cursor:pointer; transition:0.2s; }
.audit-row.success { background:#d1fae5; color:#065f46; }
.audit-row.error { background:#fee2e2; color:#991b1b; }
.audit-row.info { background:#e0f2fe; color:#0369a1; }
.audit-row:hover { background:rgba(0,0,0,0.05); }
.details { display:none; font-size:0.85rem; color:#374151; margin-top:2px; }

.audit-filter { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.audit-filter input, .audit-filter select { padding:6px; border-radius:4px; border:1px solid #ccc; font-size:0.9rem; }
.btn-role { cursor:pointer; margin-right:5px; padding:6px 10px; border-radius:4px; border:none; font-size:0.85rem; }
.btn-patient { background:#10b981; color:#fff; }
.btn-doctor { background:#3b82f6; color:#fff; }
.btn-admin { background:#f59e0b; color:#fff; }

</style>
</head>
<body>

<div class="container">
<h2>Advanced Auditing & Logging - RBAC Medical</h2>

<!-- Role Selector -->
<div class="card p-3 mb-3">
  <h5>Current Role: <span id="currentRoleDisplay">Patient</span></h5>
  <div class="d-flex gap-2 mt-2">
    <button class="btn-role btn-patient" onclick="setRole('patient')">Patient</button>
    <button class="btn-role btn-doctor" onclick="setRole('doctor')">Doctor</button>
    <button class="btn-role btn-admin" onclick="setRole('admin')">Admin</button>
  </div>
</div>

<!-- Simulate Actions -->
<div class="card p-3 mb-3">
  <h5>Simulate Actions</h5>
  <div class="d-flex gap-2 flex-wrap mt-2">
    <button class="btn btn-success btn-sm" onclick="simulateAction('Upload Document')">Upload Document</button>
    <button class="btn btn-primary btn-sm" onclick="simulateAction('Download Document')">Download Document</button>
    <button class="btn btn-danger btn-sm" onclick="simulateAction('Delete Document')">Delete Document</button>
    <button class="btn btn-warning btn-sm" onclick="simulateAction('Emergency Access')">Emergency Access</button>
    <button class="btn btn-info btn-sm" onclick="simulateAction('Send Message')">Send Message</button>
  </div>
</div>

<!-- Filters -->
<div class="card p-3 mb-3">
  <div class="audit-filter">
    <input type="text" id="auditSearch" placeholder="Search logs..." oninput="filterLogs()">
    <select id="roleFilter" onchange="filterLogs()">
      <option value="">All Roles</option>
      <option value="patient">Patient</option>
      <option value="doctor">Doctor</option>
      <option value="admin">Admin</option>
    </select>
    <select id="statusFilter" onchange="filterLogs()">
      <option value="">All Status</option>
      <option value="success">Success</option>
      <option value="error">Error</option>
      <option value="info">Info</option>
    </select>
  </div>
</div>

<!-- Audit Log Display -->
<div class="card p-3">
  <div class="audit-log" id="auditContent"></div>
</div>

</div>

<script>
let currentRole = 'patient';
document.getElementById('currentRoleDisplay').textContent = currentRole.charAt(0).toUpperCase()+currentRole.slice(1);

function setRole(role){
  currentRole = role;
  document.getElementById('currentRoleDisplay').textContent = role.charAt(0).toUpperCase()+role.slice(1);
  logAction(role,'Role Switch','System','Success',`User switched to role ${role}`);
}

// Audit Logging
const auditContent = document.getElementById('auditContent');
let auditLogs = [];

function logAction(user, action, resource, status, details){
  const timestamp = new Date();
  const log = {user, role:user, action, resource, status:status.toLowerCase(), timestamp, details};
  auditLogs.push(log);
  renderLog(log);
}

function renderLog(log){
  const div = document.createElement('div');
  div.classList.add('audit-row', log.status);
  div.dataset.text = JSON.stringify(log).toLowerCase();
  div.innerHTML = `<strong>[${log.timestamp.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}] ${log.user}</strong> ${log.action} ${log.resource} - ${log.status.charAt(0).toUpperCase()+log.status.slice(1)}
                   <div class="details">${log.details}</div>`;
  div.addEventListener('click',()=>{
    const details = div.querySelector('.details');
    details.style.display = details.style.display==='none'?'block':'none';
  });
  auditContent.prepend(div);
}

function filterLogs(){
  const search = document.getElementById('auditSearch').value.toLowerCase();
  const role = document.getElementById('roleFilter').value;
  const status = document.getElementById('statusFilter').value;
  Array.from(auditContent.children).forEach(div=>{
    const log = div.dataset.text;
    div.style.display = (log.includes(search) && (role===''||log.includes(role)) && (status===''||log.includes(status)))?'block':'none';
  });
}

// Simulate actions with randomized status
function simulateAction(action){
  const resources = ['Document','Chat','Emergency','System'];
  const statusTypes = ['success','error','info'];
  const resource = resources[Math.floor(Math.random()*resources.length)];
  const status = statusTypes[Math.floor(Math.random()*statusTypes.length)];
  logAction(currentRole, action, resource, status, `Simulated ${action} on ${resource} by ${currentRole}`);
}

// Initial demo logs
simulateAction('Upload Document');
simulateAction('Send Message');
simulateAction('Emergency Access');
</script>

</body>
</html>
