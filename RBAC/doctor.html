<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients - MedApp</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom right, #e6f4ea, #b2dfdb);
    padding-top: 70px;
  }

  .navbar { background-color: #2e7d32 !important; }
  .navbar-brand, .nav-link { color: #fff !important; }

  h2 { color: #2e7d32; text-align: center; margin-bottom: 30px; }

  .redirect-card {
    background-color: #ffffffdd;
    border-radius: 12px;
    padding: 20px;
    max-width: 300px;
    margin: 20px auto;
    box-shadow: 0 4px 10px rgba(0,128,0,0.1);
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
    text-decoration: none;
    color: #2e7d32;
  }

  .redirect-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    color: #1b4d24;
  }

  .redirect-card i {
    font-size: 40px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html">MedApp Dashboard</a>
  </div>
</nav>

<div class="container mt-5">
  <h2>Patients</h2>

  <!-- Redirect Card to Doctors Page -->
  <a href="doctor.html" class="redirect-card">
    <i class="bi bi-person-badge"></i>
    <h5>Go to Doctors Page</h5>
    <p>Click here to view doctors</p>
  </a>

  <!-- Example Patients Table -->
  <div class="table-responsive mt-4">
    <table class="table table-striped table-bordered">
      <thead class="table-success">
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>Phone</th>
          <th>Doctor</th>
          <th>Date</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody id="patientTable">
        <!-- Patient info populated from localStorage -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Load stored patient appointments from localStorage
  window.onload = function() {
    const patients = JSON.parse(localStorage.getItem("appointments") || "[]");
    const tableBody = document.getElementById("patientTable");

    patients.forEach(patient => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${patient.name}</td>
        <td>${patient.address}</td>
        <td>${patient.phone}</td>
        <td>${patient.doctor}</td>
        <td>${patient.date}</td>
        <td>${patient.reason}</td>
      `;
      tableBody.appendChild(row);
    });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
