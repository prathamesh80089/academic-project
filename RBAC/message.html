<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fb;
    }
    /* Simple fade-in animation */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-blue-900 text-white min-h-screen p-6">
    <h1 class="text-2xl font-bold mb-8">Admin</h1>
    <nav class="space-y-4">
      <a href="dashboard.html" class="flex items-center space-x-2 hover:bg-blue-700 p-2 rounded">
        <span>🏠</span><span>Dashboard</span>
      </a>
      <a href="users.html" class="flex items-center space-x-2 hover:bg-blue-700 p-2 rounded">
        <span>👥</span><span>Users</span>
      </a>
      <a href="reports.html" class="flex items-center space-x-2 hover:bg-blue-700 p-2 rounded">
        <span>📑</span><span>Reports</span>
      </a>
      <a href="msg.html" class="flex items-center space-x-2 bg-blue-700 p-2 rounded">
        <span>💬</span><span>Messages</span>
      </a>
      <a href="settings.html" class="flex items-center space-x-2 hover:bg-blue-700 p-2 rounded">
        <span>⚙️</span><span>Settings</span>
      </a>
      <a href="logout.html" class="flex items-center space-x-2 hover:bg-blue-700 p-2 rounded">
        <span>🚪</span><span>Logout</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8 fade-in">
    <header class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-700">Messages</h2>
      <div class="flex items-center space-x-3">
        <span class="text-gray-500">Admin</span>
        <img src="https://via.placeholder.com/40" class="rounded-full" alt="Admin">
      </div>
    </header>

    <!-- Message Tabs -->
    <div class="flex space-x-4 mb-6">
      <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Inbox</button>
      <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Sent</button>
      <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Archived</button>
    </div>

    <!-- Messages Table -->
    <div class="bg-white rounded-lg shadow p-6 overflow-x-auto">
      <table class="min-w-full">
        <thead>
          <tr class="border-b">
            <th class="text-left py-2">From</th>
            <th class="text-left py-2">Subject</th>
            <th class="text-left py-2">Date</th>
            <th class="text-left py-2">Status</th>
            <th class="text-left py-2">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr>
            <td class="py-3">Dr. Smith</td>
            <td class="py-3">New Appointment Request</td>
            <td class="py-3">15 Sept 2025</td>
            <td class="py-3">
              <span class="px-2 py-1 text-sm bg-green-100 text-green-700 rounded">Unread</span>
            </td>
            <td class="py-3">
              <button class="text-blue-600 hover:underline">View</button>
            </td>
          </tr>
          <tr>
            <td class="py-3">Nurse Jane</td>
            <td class="py-3">Report Submission</td>
            <td class="py-3">14 Sept 2025</td>
            <td class="py-3">
              <span class="px-2 py-1 text-sm bg-gray-100 text-gray-700 rounded">Read</span>
            </td>
            <td class="py-3">
              <button class="text-blue-600 hover:underline">View</button>
            </td>
          </tr>
          <tr>
            <td class="py-3">System</td>
            <td class="py-3">Password Change Notice</td>
            <td class="py-3">10 Sept 2025</td>
            <td class="py-3">
              <span class="px-2 py-1 text-sm bg-gray-100 text-gray-700 rounded">Read</span>
            </td>
            <td class="py-3">
              <button class="text-blue-600 hover:underline">View</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
