<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Reschedule Appointments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #f0f4f8;
  padding: 30px;
}

/* Heading animation */
h2 {
  color: #2563eb;
  margin-bottom: 30px;
  text-align: center;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-20px);
  animation: fadeInDown 1s forwards;
}
@keyframes fadeInDown {
  to { opacity: 1; transform: translateY(0); }
}

/* Table styling */
table {
  width: 100%;
  border-collapse: collapse;
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
th, td {
  padding: 14px 12px;
  border-bottom: 1px solid #eee;
  transition: background 0.3s, transform 0.3s;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.5s forwards;
}
th {
  background: #3b82f6;
  color: #fff;
  cursor: pointer;
}
th:nth-child(1) { animation-delay: 0.2s; }
th:nth-child(2) { animation-delay: 0.3s; }
th:nth-child(3) { animation-delay: 0.4s; }
th:nth-child(4) { animation-delay: 0.5s; }

@keyframes fadeInUp {
  to { opacity: 1; transform: translateY(0); }
}

tr:hover {
  background: #e0f2fe;
  transform: scale(1.02);
}

/* Input & button animation */
input[type="datetime-local"] {
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  transition: transform 0.3s, box-shadow 0.3s;
}
input[type="datetime-local"]:focus {
  outline: none;
  box-shadow: 0 0 12px rgba(59,130,246,0.4);
  transform: scale(1.05);
}
.btn-reschedule {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background: #10b981;
  color: #fff;
  cursor: pointer;
  transition: transform 0.3s, background 0.3s;
}
.btn-reschedule:hover {
  background: #059669;
  animation: bounce 0.4s;
}
@keyframes bounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* Row highlight animation */
.row-highlight {
  animation: highlightRow 0.8s forwards;
}
@keyframes highlightRow {
  0% { background: #d1fae5; }
  100% { background: #fff; }
}

/* Responsive */
@media(max-width:768px){
  table, th, td { font-size: 14px; }
}
</style>
</head>
<body>

<h2>Reschedule Appointments</h2>
<table id="appointmentTable">
  <thead>
    <tr>
      <th>Patient</th>
      <th>Current Date & Time</th>
      <th>Doctor</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Suraj</td>
      <td>2025-09-29 10:00 AM</td>
      <td>Dr. Kevin White</td>
      <td>
        <input type="datetime-local" class="newDateTime">
        <button onclick="rescheduleAppointment(this)" class="btn-reschedule">Reschedule</button>
      </td>
    </tr>
    <tr>
      <td>John Doe</td>
      <td>2025-10-16 02:00 PM</td>
      <td>Dr. Sarah Lee</td>
      <td>
        <input type="datetime-local" class="newDateTime">
        <button onclick="rescheduleAppointment(this)" class="btn-reschedule">Reschedule</button>
      </td>
    </tr>
    <tr>
      <td>Sarvesh</td>
      <td>2025-10-01 05:30 PM</td>
      <td>Dr. Kevin White</td>
      <td>
        <input type="datetime-local" class="newDateTime">
        <button onclick="rescheduleAppointment(this)" class="btn-reschedule">Reschedule</button>
      </td>
    </tr>
  </tbody>
</table>

<script>
// Animate table rows on load
window.onload = () => {
  const rows = document.querySelectorAll('#appointmentTable tbody tr');
  rows.forEach((row, i) => {
    row.style.opacity = 0;
    row.style.transform = 'translateY(20px)';
    setTimeout(() => {
      row.style.transition = 'opacity 0.6s, transform 0.6s';
      row.style.opacity = 1;
      row.style.transform = 'translateY(0)';
    }, i * 200);
  });
}

// Reschedule function
function rescheduleAppointment(btn){
  const row = btn.closest('tr');
  const patient = row.cells[0].textContent;
  const oldDate = row.cells[1].textContent;
  const newDateInput = row.querySelector('.newDateTime');
  const newDate = newDateInput.value;

  if(!newDate){
    alert("Please select a new date & time.");
    return;
  }

  row.cells[1].textContent = new Date(newDate).toLocaleString();
  newDateInput.value = '';

  // Add highlight animation
  row.classList.add('row-highlight');
  setTimeout(()=> row.classList.remove('row-highlight'), 800);

  alert(`Appointment for ${patient} rescheduled from ${oldDate} to ${row.cells[1].textContent}`);
}
</script>

</body>
</html>
