<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical RBAC System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: url('accesscontrol.jpg') no-repeat center center fixed;
  background-size: cover;
  transition: 0.3s;
}
.auth-section {
  display: none;
  padding-top: 50px;
  min-height: 100vh;
}
.card-login {
  background: rgba(255, 255, 255, 0.9);
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,128,0,0.2);
  padding: 2rem;
}
h2 {
  color: #2e7d32;
  text-align: center;
}
label {
  display: block;
  margin-top: 10px;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
.btn {
  margin-top: 15px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: #2e7d32;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.btn:hover {
  background: #256028;
}
p.text-center a {
  text-decoration: none;
  color: #2e7d32;
}
p.text-center a:hover {
  text-decoration: underline;
}
#strength-bar {
  height: 6px;
  border-radius: 5px;
  margin-top: 5px;
  transition: all 0.3s ease;
}
.strength-text {
  font-size: 13px;
  font-weight: bold;
  margin-top: 3px;
}
</style>
</head>
<body>

<!-- LOGIN FORM -->
<div class="auth-section" id="login-form" style="display:block;">
  <div class="container card-login mx-auto" style="max-width:400px;">
    <h2>Login</h2>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Enter your email">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter your password">
    <button class="btn" onclick="login()">Login</button>
    <p class="text-center mt-2">
      <a href="#" onclick="showForm('register-form')">Sign Up</a> | 
      <a href="#" onclick="showForm('forgot-form')">Forgot Password?</a>
    </p>
  </div>
</div>

<!-- REGISTER FORM -->
<div class="auth-section" id="register-form">
  <div class="container card-login mx-auto" style="max-width:400px;">
    <h2>Sign Up</h2>
    <label>Name</label>
    <input type="text" id="registerName" placeholder="Enter your name">
    <label>Email</label>
    <input type="email" id="registerEmail" placeholder="Enter your email">
    <label>Password</label>
    <input type="password" id="registerPassword" placeholder="Enter password" oninput="checkPasswordStrength(this.value)">
    <div id="strength-bar"></div>
    <div class="strength-text" id="strength-text"></div>
    <label>Confirm Password</label>
    <input type="password" id="registerConfirmPassword" placeholder="Confirm password">
    <label>Role</label>
    <select id="registerRole" class="form-select">
      <option value="">Select Role</option>
      <option value="admin">Admin</option>
      <option value="doctor">Doctor</option>
      <option value="nurse">Nurse</option>
      <option value="receptionist">Receptionist</option>
      <option value="patient">Patient</option>
    </select>
    <button class="btn" onclick="register()">Sign Up</button>
    <p class="text-center mt-2">
      <a href="#" onclick="showForm('login-form')">Back to Login</a>
    </p>
  </div>
</div>

<!-- FORGOT PASSWORD FORM -->
<div class="auth-section" id="forgot-form">
  <div class="container card-login mx-auto" style="max-width:400px;">
    <h2>Forgot Password</h2>
    <label>Email</label>
    <input type="email" id="forgotEmail" placeholder="Enter your email">
    <button class="btn" onclick="forgotPassword()">Reset Password</button>
    <p class="text-center mt-2">
      <a href="#" onclick="showForm('login-form')">Back to Login</a>
    </p>
  </div>
</div>

<script>
let users = [
  {name:"Admin", email:"admin@gmail.com", password:"admin123", role:"admin"},
  {name:"Doctor", email:"doctor@gmail.com", password:"doc123", role:"doctor"},
  {name:"Nurse", email:"nurse@gmail.com", password:"nurse123", role:"nurse"},
  {name:"Receptionist", email:"reception@gmail.com", password:"recep123", role:"receptionist"},
  {name:"Patient", email:"patient@gmail.com", password:"patient123", role:"patient"},
];

function showForm(id) {
  document.querySelectorAll('.auth-section').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

function register() {
  const name = document.getElementById("registerName").value;
  const email = document.getElementById("registerEmail").value;
  const password = document.getElementById("registerPassword").value;
  const confirm = document.getElementById("registerConfirmPassword").value;
  const role = document.getElementById("registerRole").value;

  if (!name || !email || !password || !confirm || !role) return alert("Fill all fields");
  if (password !== confirm) return alert("Passwords do not match");
  if (users.find(u => u.email === email)) return alert("Email already exists");

  users.push({ name, email, password, role });
  alert("Signup successful!");
  showForm("login-form");
}

// ✅ ROLE-BASED LOGIN REDIRECTION
function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  const user = users.find(u => u.email === email && u.password === password);
  if (user) {
    sessionStorage.setItem("loggedIn", "true");
    sessionStorage.setItem("role", user.role);
    sessionStorage.setItem("name", user.name);
    alert("Login successful!");

    switch (user.role) {
      case "admin":
        window.location.href = "admin-dashboard.html";
        break;
      case "doctor":
        window.location.href = "doctor-dashboard.html";
        break;
      case "nurse":
        window.location.href = "nurse-dashboard.html";
        break;
      case "receptionist":
        window.location.href = "receptionist-dashboard.html";
        break;
      case "patient":
        window.location.href = "patient-dashboard.html";
        break;
      default:
        window.location.href = "index.html";
    }
  } else {
    alert("Invalid credentials");
  }
}

function checkPasswordStrength(password) {
  const bar = document.getElementById("strength-bar");
  const text = document.getElementById("strength-text");
  let strength = 0;

  if (password.length >= 6) strength++;
  if (/[A-Z]/.test(password)) strength++;
  if (/[a-z]/.test(password)) strength++;
  if (/[0-9]/.test(password)) strength++;
  if (/[@$!%*?&]/.test(password)) strength++;

  switch (strength) {
    case 0:
      bar.style.width = "0";
      text.textContent = "";
      break;
    case 1:
      bar.style.width = "20%";
      bar.style.background = "red";
      text.textContent = "Weak";
      text.style.color = "red";
      break;
    case 2:
      bar.style.width = "40%";
      bar.style.background = "orange";
      text.textContent = "Fair";
      text.style.color = "orange";
      break;
    case 3:
      bar.style.width = "60%";
      bar.style.background = "yellowgreen";
      text.textContent = "Good";
      text.style.color = "yellowgreen";
      break;
    case 4:
      bar.style.width = "80%";
      bar.style.background = "#2e7d32";
      text.textContent = "Strong";
      text.style.color = "#2e7d32";
      break;
    case 5:
      bar.style.width = "100%";
      bar.style.background = "green";
      text.textContent = "Very Strong";
      text.style.color = "green";
      break;
  }
}

function forgotPassword() {
  const email = document.getElementById("forgotEmail").value.trim();
  const user = users.find(u => u.email === email);
  if (user) {
    alert("Password reset link sent to your email (demo mode).");
  } else {
    alert("Email not found.");
  }
}
</script>
</body>
</html>
